<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircon Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <h2 class="ms-3">Aircon Service Booking</h2>
        </div>
    </header>
    <div class="container-fluid">
        <div class="row gx-4">
            <div class="col-lg-3 col-12">
                <div class="card form-card">
                    <div class="card-heading">
                        <div>
                            <span class="eyebrow" id="formEyebrow">NEW BOOKING</span>
                            <h2 id="formTitle">Add Booking</h2>
                        </div>
                    </div>

                    <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>
                    
                    <div id="bookingForm">
                        <input type="hidden" class="form-control" id="bookingId">
                        <div class="form-group mb-3">
                            <label for="bookingDate" class="form-label">Booking Date <span>*</span></label>
                            <input type="date" class="form-control" id="bookingDate" required>
                            <small class="field-error" id="bookingDateError"></small>
                        </div>
                        <div class="form-group mb-3">
                            <label for="name" class="form-label">Name <span>*</span></label>
                            <input type="text" class="form-control" id="name" placeholder="e.g. John Tan" required>
                            <small class="field-error" id="nameError"></small>
                        </div>
                        <div class="form-group mb-3">
                            <label for="contactNo" class="form-label">Contact No. <span>*</span></label>
                            <input type="text" class="form-control" id="contactNo" placeholder="e.g. 91234567" maxlength="20" required>
                            <small class="field-error" id="contactNoError"></small>
                        </div>
                        <div class="form-group mb-3">
                            <label for="email" class="form-label">Email Address <span>*</span></label>
                            <input type="email" class="form-control" id="email" placeholder="e.g. john@email.com" maxlength="150" required>
                            <small class="field-error" id="emailError"></small>
                        </div>
                        <div class="form-group mb-3">
                            <label for="serviceDetails" class="form-label">Service Details <span>*</span></label>
                            <textarea class="form-control" id="serviceDetails" rows="4" maxlength="500"
                                placeholder="Describe the aircon service required..." required></textarea>
                                <small class="field-error" id="serviceDetailsError"></small>
                        </div>

                        <div class="form-actions">
                            <button class="btn btn-primary" id="submitBtn">
                                <span id="submitText">Add Booking</span>
                            </button>
                            <button class="btn btn-secondary" id="clearBtn">Clear</button>
                        </div>
                    </div>
                </div>

            </div>
            <div class="col-lg-9 col-12">
                <div class="card records-card">
                    <div class="card-heading">
                        <div>
                            <span class="eyebrow">BOOKING MANAGEMENT</span>
                            <h2>Booking Records</h2>
                        </div>
                    </div>
                    <div id="desktopTableWrap" class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Contact</th>
                                <th>Email</th>
                                <th>Service Details</th>
                                <th class="action-column">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bookingTableBody"></tbody>
                    </table>
                </div>

                <div id="mobileBookings" class="mobile-bookings"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
