<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircon Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="row gx-4">
            <div class="col-lg-3 col-12">
                <div class="card-heading mt-5">
                    <div>
                        <!-- <span class="eyebrow" id="formEyebrow">NEW BOOKING</span> -->
                        <h2 id="formTitle">Add Booking</h2>
                    </div>
                    <!-- <button type="button" class="text-button hidden" id="cancelEditBtn">Cancel edit</button> -->
                </div>
                <div id="bookingForm">
                    <input type="hidden" id="bookingId">
                    <div class="mb-3">
                        <label for="bookingDate" class="form-label">Booking Date:</label>
                        <input type="date" class="form-control" id="bookingDate">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name:</label>
                        <input type="text" class="form-control" id="name" placeholder="e.g. John Tan">
                    </div>
                    <div class="mb-3">
                        <label for="contactNo" class="form-label">Contact No.:</label>
                        <input type="text" class="form-control" id="contactNo" placeholder="e.g. 91234567">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address:</label>
                        <input type="email" class="form-control" id="email" placeholder="e.g. john@email.com">
                    </div>
                    <div class="mb-3">
                        <label for="serviceDetails" class="form-label">Service Details:</label>
                        <textarea class="form-control" id="serviceDetails" rows="4"
                            placeholder="Describe the aircon service required..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span id="submitText">Add Booking</span>
                        </button>
                        <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-8 col-12">
                <div id="bookingRecords" class="gy-4">
                    <h4 class="mb-3 mt-5">Booking Records</h4>
                    <table class="table table-primary table-striped table-bordered table-wrap">
                        <thead>
                            <tr>
                                <th scope="col">Date</th>
                                <th scope="col">Customer</th>
                                <th scope="col">Contact</th>
                                <th scope="col">Email</th>
                                <th scope="col">Service Details</th>
                                <th scope="col" class="action-column">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bookingTableBody"></tbody>
                    </table>

                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
